name: Deploy dashboard to GitHub Pages

# Runs on every push to main — triggered by the publish-portfolio.yml workflow
# in VincePipelineTest whenever a run, artwork, or dashboard change lands.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact (exclude large image dirs)
        run: rsync -a --exclude='renders/' --exclude='drafts/' public/ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub's Pages service sometimes fails for a short time with
      # "No artifacts named github-pages were found". The workflow then
      # waits and tries again, up to three times in total.
      - name: Deploy to GitHub Pages, first try
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the second try
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages, second try
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the third try
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180

      - name: Deploy to GitHub Pages, third try
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
